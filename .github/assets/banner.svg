<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1d2e"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity=".45"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>

  <!-- left: title -->
  <text x="64" y="138" fill="#e6edf3" font-size="64" font-weight="700" letter-spacing="-1">dsh-vitals</text>
  <text x="66" y="186" fill="#9fb3c8" font-size="24">Live CPU, memory, temperature and GPU load,</text>
  <text x="66" y="218" fill="#9fb3c8" font-size="24">right inside the DeepSeek Harness web GUI.</text>
  <g font-size="16" font-weight="600">
    <rect x="66" y="252" width="132" height="34" rx="17" fill="#132a22" stroke="#34d399" stroke-opacity=".5"/>
    <text x="132" y="274" fill="#6ee7b7" text-anchor="middle">btop-style</text>
    <rect x="210" y="252" width="186" height="34" rx="17" fill="#132a22" stroke="#34d399" stroke-opacity=".5"/>
    <text x="303" y="274" fill="#6ee7b7" text-anchor="middle">zero dependencies</text>
    <rect x="408" y="252" width="124" height="34" rx="17" fill="#132a22" stroke="#34d399" stroke-opacity=".5"/>
    <text x="470" y="274" fill="#6ee7b7" text-anchor="middle">no config</text>
  </g>

  <!-- right: stylised panel -->
  <g transform="translate(660 44)">
    <rect width="480" height="272" rx="14" fill="#0a1019" stroke="#1f2d3d"/>
    <circle cx="22" cy="20" r="5" fill="#f87171"/><circle cx="40" cy="20" r="5" fill="#fbbf24"/><circle cx="58" cy="20" r="5" fill="#34d399"/>
    <text x="458" y="25" fill="#5b6b7d" font-size="13" text-anchor="end">Hardware</text>

    <!-- CPU sparkline -->
    <text x="22" y="62" fill="#9fb3c8" font-size="13" font-weight="600">CPU</text>
    <text x="458" y="62" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="end">47%  ·  61°C</text>
    <path d="M22 118 L52 104 L82 110 L112 92 L142 98 L172 80 L202 88 L232 72 L262 84 L292 76 L322 90 L352 70 L382 78 L412 66 L458 74 L458 124 L22 124 Z" fill="url(#spark)"/>
    <path d="M22 118 L52 104 L82 110 L112 92 L142 98 L172 80 L202 88 L232 72 L262 84 L292 76 L322 90 L352 70 L382 78 L412 66 L458 74" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- per-core bars -->
    <g fill="#1a2634">
      <rect x="22" y="136" width="46" height="8" rx="4"/><rect x="76" y="136" width="46" height="8" rx="4"/><rect x="130" y="136" width="46" height="8" rx="4"/><rect x="184" y="136" width="46" height="8" rx="4"/>
      <rect x="238" y="136" width="46" height="8" rx="4"/><rect x="292" y="136" width="46" height="8" rx="4"/><rect x="346" y="136" width="46" height="8" rx="4"/><rect x="400" y="136" width="58" height="8" rx="4"/>
    </g>
    <g fill="#34d399">
      <rect x="22" y="136" width="30" height="8" rx="4"/><rect x="76" y="136" width="18" height="8" rx="4"/><rect x="130" y="136" width="40" height="8" rx="4"/><rect x="184" y="136" width="12" height="8" rx="4"/>
      <rect x="238" y="136" width="26" height="8" rx="4"/><rect x="292" y="136" width="36" height="8" rx="4"/><rect x="346" y="136" width="14" height="8" rx="4"/><rect x="400" y="136" width="44" height="8" rx="4" fill="#fbbf24"/>
    </g>

    <!-- memory -->
    <text x="22" y="178" fill="#9fb3c8" font-size="13" font-weight="600">Memory</text>
    <text x="458" y="178" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="end">21.4 / 64 GB</text>
    <rect x="22" y="188" width="436" height="10" rx="5" fill="#1a2634"/>
    <rect x="22" y="188" width="146" height="10" rx="5" fill="#60a5fa"/>

    <!-- GPU -->
    <text x="22" y="228" fill="#9fb3c8" font-size="13" font-weight="600">GPU 0</text>
    <text x="458" y="228" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="end">92% · 71°C · 187 W</text>
    <rect x="22" y="238" width="436" height="10" rx="5" fill="#1a2634"/>
    <rect x="22" y="238" width="372" height="10" rx="5" fill="#f472b6"/>
    <text x="22" y="264" fill="#5b6b7d" font-size="12">VRAM 21.1 / 24 GB</text>
  </g>
</svg>
