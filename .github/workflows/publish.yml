name: Auto-version

# Every push to main bumps the patch version, rebuilds lib/ (in case a commit
# forgot to — see AGENTS.md's build-step warning), commits that back, tags
# it, and cuts a GitHub Release. GitHub-only — no npm publish, no token to
# maintain; npm publish stays a manual `npm publish` when actually wanted.
# The [skip ci] guard + actor check stop the bot's own push from
# re-triggering this workflow.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Rebuild lib/ (safety net if a commit forgot)
        run: node scripts/build.mjs

      - name: Bump patch version
        id: version
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit the bump + any rebuilt lib/, tag it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json lib/
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --follow-tags

      - name: Cut a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --generate-notes --title "v${{ steps.version.outputs.version }}"
